name: Azure Functions CI

on:
  pull_request:
    paths:
      - "azure/functions/**"
      - ".github/workflows/functions-ci.yml"
  push:
    branches: [main]
    paths:
      - "azure/functions/**"
      - ".github/workflows/functions-ci.yml"

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: azure/functions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install Functions runtime dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Functions tests with v4 runtime package installed
        run: node --test tests/*.test.js

      - name: Emit generated lockfile for bootstrap
        run: |
          echo 'LOCKFILE_BEGIN'
          base64 -w0 package-lock.json
          echo
          echo 'LOCKFILE_END'
