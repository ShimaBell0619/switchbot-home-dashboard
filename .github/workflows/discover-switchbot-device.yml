name: Discover SwitchBot PoC device

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    if: >-
      ${{ github.event.issue.number == 3 &&
          !github.event.issue.pull_request &&
          github.event.comment.body == '/discover-switchbot-device' &&
          github.event.comment.author_association == 'OWNER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Authorize exact discovery request
        run: |
          echo "Authorized SwitchBot device discovery for Issue #3 from repository owner."

  discover:
    needs: authorize
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AZURE_CLIENT_ID: 803efb43-a00d-4113-8020-8c88996c7841
      AZURE_TENANT_ID: 68bc9518-b4ee-443a-abbf-9a642a0a8735
      AZURE_SUBSCRIPTION_ID: 82615ba2-5bd4-401d-b054-50df1e0e0333
      RESOURCE_GROUP: rg-switchbot-poc-jpe-01
      API_BASE_URL: https://func-switchbot-bnmrxfo7.azurewebsites.net
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Sign in to Azure with OIDC
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Discover and configure one environmental device
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          function_app="$(az functionapp list --resource-group "$RESOURCE_GROUP" --query '[0].name' --output tsv)"
          [[ -n "$function_app" ]]

          settings="$(az functionapp config appsettings list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$function_app" \
            --output json)"

          configured_names="$(jq -r '.[].name | select(startswith("SWITCHBOT_"))' <<< "$settings" | sort | paste -sd ',' -)"
          echo "Configured SwitchBot setting names: ${configured_names:-none}"

          token="$(jq -r '.[] | select(.name == "SWITCHBOT_TOKEN") | .value' <<< "$settings")"
          secret="$(jq -r '.[] | select(.name == "SWITCHBOT_SECRET") | .value' <<< "$settings")"

          if [[ -z "$token" || "$token" == "null" ]]; then
            echo "::error::SWITCHBOT_TOKEN was not found in the Function App settings."
            exit 1
          fi
          if [[ -z "$secret" || "$secret" == "null" ]]; then
            echo "::error::SWITCHBOT_SECRET was not found in the Function App settings."
            exit 1
          fi

          echo "::add-mask::$token"
          echo "::add-mask::$secret"
          export SWITCHBOT_TOKEN="$token"
          export SWITCHBOT_SECRET="$secret"

          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          async function main() {
            const token = process.env.SWITCHBOT_TOKEN;
            const secret = process.env.SWITCHBOT_SECRET;
            const t = Date.now().toString();
            const nonce = crypto.randomUUID();
            const sign = crypto
              .createHmac('sha256', secret)
              .update(Buffer.from(token + t + nonce, 'utf8'))
              .digest('base64');

            const response = await fetch('https://api.switch-bot.com/v1.1/devices', {
              headers: {
                Authorization: token,
                sign,
                t,
                nonce,
                'Content-Type': 'application/json; charset=utf8',
              },
            });

            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.statusCode !== 100) {
              throw new Error(`SwitchBot device discovery failed: HTTP ${response.status}, API ${payload?.statusCode ?? 'unknown'}`);
            }

            const devices = Array.isArray(payload?.body?.deviceList) ? payload.body.deviceList : [];
            const preferredTypes = [
              'MeterPro(CO2)',
              'MeterPro',
              'MeterPlus',
              'Meter',
              'WoIOSensor',
              'WeatherStation',
              'Hub 2',
              'Hub 3',
            ];

            const candidates = devices
              .filter((device) => preferredTypes.includes(device.deviceType))
              .filter((device) => device.enableCloudService !== false)
              .sort((left, right) => preferredTypes.indexOf(left.deviceType) - preferredTypes.indexOf(right.deviceType));

            if (candidates.length === 0) {
              const availableTypes = [...new Set(devices.map((device) => device.deviceType).filter(Boolean))].sort();
              throw new Error(`No cloud-enabled environmental device found. Available device types: ${availableTypes.join(', ') || 'none'}`);
            }

            const selected = candidates[0];
            fs.writeFileSync('/tmp/switchbot-device-id', selected.deviceId, { mode: 0o600 });
            fs.writeFileSync('/tmp/switchbot-device-type', selected.deviceType, { mode: 0o600 });
            console.log(`Selected one environmental SwitchBot device of type ${selected.deviceType} from ${candidates.length} candidate(s).`);
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE

          device_id="$(cat /tmp/switchbot-device-id)"
          device_type="$(cat /tmp/switchbot-device-type)"
          [[ -n "$device_id" ]]
          echo "::add-mask::$device_id"

          az functionapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$function_app" \
            --settings "SWITCHBOT_DEVICE_ID=$device_id" \
            --output none

          echo "device_type=$device_type" >> "$GITHUB_OUTPUT"
          echo "function_app=$function_app" >> "$GITHUB_OUTPUT"

      - name: Wait for scheduled collection and verify stored read path
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 26); do
            http_status="$(curl --silent --show-error --output /tmp/latest.json --write-out '%{http_code}' "$API_BASE_URL/api/latest" || true)"
            api_status="$(jq -r '.status // empty' /tmp/latest.json 2>/dev/null || true)"
            if [[ "$http_status:$api_status" == "200:ok" ]]; then
              history_status="$(curl --silent --show-error --output /tmp/history.json --write-out '%{http_code}' "$API_BASE_URL/api/history?window=1h" || true)"
              history_api_status="$(jq -r '.status // empty' /tmp/history.json 2>/dev/null || true)"
              if [[ "$history_status:$history_api_status" == "200:ok" ]]; then
                reading_count="$(jq -r '(.data // []) | length' /tmp/history.json 2>/dev/null || echo 0)"
                if (( reading_count > 0 )); then
                  echo "Stored SwitchBot read path is ready (latest 200/ok, history 200/ok, history rows: $reading_count)."
                  exit 0
                fi
              fi
            fi
            sleep 15
          done

          echo "::error::No successful stored SwitchBot reading appeared within the discovery validation window."
          exit 1

      - name: Record discovery evidence
        shell: bash
        env:
          DEVICE_TYPE: ${{ steps.discover.outputs.device_type }}
          FUNCTION_APP: ${{ steps.discover.outputs.function_app }}
        run: |
          {
            echo '### SwitchBot PoC device discovery'
            echo "- Selected device type: \`$DEVICE_TYPE\`"
            echo "- Function App: \`$FUNCTION_APP\`"
            echo '- Device ID and SwitchBot credentials were not printed.'
            echo '- Scheduled collection produced data readable from both `/api/latest` and bounded `/api/history`.'
          } >> "$GITHUB_STEP_SUMMARY"
